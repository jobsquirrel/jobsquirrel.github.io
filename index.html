<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobSquirrel</title>
<meta name="description" content="JobSquirrel: save job ads before they disappear, and track your applications. Free, open source, and your data stays on your computer.">
<style>
  :root { color-scheme: light dark; --bg:#fffaf3; --fg:#2b2118; --muted:#7a6a5a; --accent:#b5651d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1813; --fg:#f3ebe1; --muted:#b3a492; --accent:#e0954a; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:18px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:36rem; text-align:center; }
  .logo { font-size:4rem; }
  h1 { margin:.2em 0; font-size:2.4rem; }
  p { color:var(--muted); }
  .soon { display:inline-block; margin-top:1rem; padding:.3em .9em; border:2px solid var(--accent);
          border-radius:999px; color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🐿️</div>
  <h1>JobSquirrel</h1>
  <p>Stash job ads before they disappear, and keep track of every application.<br>
     Free and open source. Your data stays on your computer.</p>
  <span class="soon">Coming soon</span>
</main>
</body>
</html>
